<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>随机图片互动</title>
  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:#f7f7f7;
    }
    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:40px;
      box-sizing:border-box;
    }
    .card{
      width:min(520px, 92vw);
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }
    img{
      width:320px;
      max-width:90%;
      height:auto;
      display:block;
      margin:0 auto;
      border-radius:12px;
    }
    .gap{ height:18px; }
    .actions{
      display:flex;
      justify-content:space-between;
      margin-top:18px;
      padding:0 18px;
      user-select:none;
    }
    .action{
      font-size:22px;
      font-weight:700;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      transition: transform .08s ease, background .15s ease;
    }
    .action:hover{
      background:#f0f0f0;
      transform: translateY(-1px);
    }
    .hint{
      margin-top:10px;
      font-size:13px;
      color:#666;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <!-- 中间上方 cat.jpg -->
      <img src="images/cat.jpg" alt="cat" />

      <div class="gap"></div>

      <!-- cat.jpg 下方的随机图片 -->
      <img id="randomImg" alt="random" />

      <!-- 随机图片下方左右两边互动文字 -->
      <div class="actions">
        <div id="btnCarrot" class="action">萝卜</div>
        <div id="btnPaper" class="action">纸巾</div>
      </div>

      <div class="hint" id="hint"></div>
    </div>
  </div>

  <script>
    // 1) 随机从 carrot.jpg / paper.jpg 选一张
    const options = ["carrot", "paper"];
    const picked = options[Math.floor(Math.random() * options.length)];

    // 2) 显示随机图片
    const randomImg = document.getElementById("randomImg");
    randomImg.src = `images/${picked}.jpg`;

    // 3) 保存随机结果（用于点击判断；也保证从 result.html 返回时仍能知道当次随机是什么）
    sessionStorage.setItem("picked", picked);

    // 4) 点击逻辑
    const btnCarrot = document.getElementById("btnCarrot");
    const btnPaper = document.getElementById("btnPaper");
    const hint = document.getElementById("hint");

    function goResult() {
      // 跳转到新页面
      window.location.href = "result.html";
    }

    btnCarrot.addEventListener("click", () => {
      const current = sessionStorage.getItem("picked");
      if (current === "carrot") {
        goResult();        // 随机图是 carrot.jpg，点“萝卜”才跳转
      } else {
        hint.textContent = "当前随机图是纸巾（paper.jpg），点“萝卜”不会跳转。";
      }
    });

    btnPaper.addEventListener("click", () => {
      const current = sessionStorage.getItem("picked");
      if (current === "paper") {
        goResult();        // 随机图是 paper.jpg，点“纸巾”才跳转
      } else {
        hint.textContent = "当前随机图是萝卜（carrot.jpg），点“纸巾”不会跳转。";
      }
    });
  </script>
</body>
</html>
